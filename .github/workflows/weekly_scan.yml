name: HK Stocks Weinstein Daily Scanner

on:
  schedule:
    # 逢星期一至五 UTC 08:30 (香港時間 16:30，港股收市後)
    - cron: '30 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run HK Stock Scanner
        run: python scanner.py

      - name: Commit and push results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add results/ docs/data.json
          git diff --staged --quiet || git commit -m "chore: update HK daily scan results and dashboard"
          git push
